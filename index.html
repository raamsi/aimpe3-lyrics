<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <title>AimpE3 - Gestionnaire de Paroles</title>
    <style>
        /* ========== RESET & BASE ========== */
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #1DB954;
            --primary-hover: #1ed760;
            --danger: #e74c3c;
            --warning: #f39c12;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --input-bg: #2a2a2a;
            --border: #333;
            --text: #ffffff;
            --text-muted: #a1a1aa;
            --radius: 12px;
            --radius-sm: 6px;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at 20% 0%, rgba(29, 185, 84, 0.08), transparent 50%);
            color: var(--text);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* ========== CONTAINER RESPONSIVE ========== */
        .container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 28px;
            border-radius: var(--radius);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h2 {
            color: var(--primary);
            text-align: center;
            margin: 0 0 8px;
            font-size: clamp(1.3rem, 4vw, 1.6rem);
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: clamp(0.8rem, 2.5vw, 0.9rem);
            margin-bottom: 24px;
        }

        h3 {
            font-size: clamp(1rem, 3vw, 1.15rem);
            margin-bottom: 16px;
        }

        /* ========== INPUTS ========== */
        input[type="email"],
        input[type="password"],
        input[type="file"] {
            width: 100%;
            padding: 14px 12px;
            margin: 8px 0;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--input-bg);
            color: var(--text);
            font-size: 16px; /* Évite le zoom auto sur iOS */
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(29, 185, 84, 0.15);
        }

        input.invalid {
            border-color: var(--danger);
        }

        /* ========== BOUTONS ========== */
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s, transform 0.1s;
            min-height: 48px; /* Cible tactile confortable */
        }

        button:hover:not(:disabled) { background-color: var(--primary-hover); }
        button:active:not(:disabled) { transform: scale(0.98); }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .switch-btn {
            background: none;
            color: var(--text-muted);
            border: none;
            text-decoration: underline;
            margin-top: 15px;
            font-size: 0.9em;
            cursor: pointer;
            min-height: auto;
            padding: 8px;
        }
        .switch-btn:hover { color: var(--primary); background: none; }

        .logout-btn {
            background: var(--danger);
            width: auto;
            padding: 8px 16px;
            margin: 0;
            font-size: 0.9rem;
            min-height: 40px;
        }

        /* ========== ÉTATS ========== */
        .hidden { display: none !important; }

        #status {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            min-height: 1.2em;
            line-height: 1.4;
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--input-bg);
            padding: 12px;
            border-radius: var(--radius-sm);
            margin-bottom: 18px;
            gap: 10px;
        }

        #user-email {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.9rem;
            flex: 1;
        }

        .hint {
            font-size: 0.85em;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-align: center;
            line-height: 1.5;
        }

        /* ========== INDICATEUR DE MOT DE PASSE ========== */
        .password-strength {
            height: 4px;
            background: var(--input-bg);
            border-radius: 2px;
            overflow: hidden;
            margin: -2px 0 10px;
        }

        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: width 0.3s, background-color 0.3s;
            background: var(--danger);
        }

        .password-strength-bar.weak { width: 33%; background: var(--danger); }
        .password-strength-bar.medium { width: 66%; background: var(--warning); }
        .password-strength-bar.strong { width: 100%; background: var(--primary); }

        .password-requirements {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: 4px 0 12px;
            padding-left: 18px;
            line-height: 1.6;
        }
        .password-requirements li {
            list-style: none;
            position: relative;
        }
        .password-requirements li::before {
            content: "○";
            position: absolute;
            left: -16px;
            color: var(--text-muted);
        }
        .password-requirements li.ok { color: var(--primary); }
        .password-requirements li.ok::before { content: "✓"; color: var(--primary); }

        /* ========== RESPONSIVE : TABLETTE ========== */
        @media (min-width: 600px) {
            body { padding: 30px; }
            .container {
                max-width: 520px;
                padding: 36px;
            }
            input[type="email"],
            input[type="password"],
            input[type="file"] {
                padding: 15px 14px;
            }
        }

        /* ========== RESPONSIVE : LAPTOP / DESKTOP ========== */
        @media (min-width: 1024px) {
            body { padding: 40px; }
            .container {
                max-width: 480px;
                padding: 40px;
            }
            button:hover:not(:disabled) {
                transform: translateY(-1px);
                box-shadow: 0 4px 12px rgba(29, 185, 84, 0.25);
            }
        }

        /* ========== RESPONSIVE : PETITS MOBILES ========== */
        @media (max-width: 400px) {
            body { padding: 12px; }
            .container { padding: 20px; border-radius: 8px; }
            h3 { font-size: 1rem; }
            .user-info { padding: 10px; }
            .logout-btn { padding: 6px 12px; font-size: 0.8rem; }
        }

        /* ========== MODE PAYSAGE MOBILE ========== */
        @media (max-height: 500px) and (orientation: landscape) {
            body { align-items: flex-start; padding: 12px; }
            .container { padding: 18px; }
            h2 { margin-bottom: 4px; }
            .subtitle { margin-bottom: 12px; }
        }

        /* ========== ACCESSIBILITÉ ========== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }

        .sr-only {
            position: absolute;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>

<div class="container" role="main">
    <h2>🎵 AimpE3 Lyrics Studio</h2>
    <p class="subtitle">Publiez et gérez vos paroles synchronisées</p>

    <!-- Formulaire d'authentification -->
    <div id="auth-section">
        <h3 id="form-title">Connexion</h3>

        <label for="email" class="sr-only">Adresse email</label>
        <input type="email" id="email" placeholder="Adresse Email"
               autocomplete="email" inputmode="email" required>

        <label for="password" class="sr-only">Mot de passe</label>
        <input type="password" id="password" placeholder="Mot de passe"
               autocomplete="current-password" required>

        <!-- Indicateur de force (visible uniquement à l'inscription) -->
        <div id="strength-wrapper" class="hidden">
            <div class="password-strength">
                <div id="strength-bar" class="password-strength-bar"></div>
            </div>
            <ul class="password-requirements" id="pwd-reqs">
                <li data-req="length">Au moins 12 caractères</li>
                <li data-req="upper">Une majuscule</li>
                <li data-req="lower">Une minuscule</li>
                <li data-req="digit">Un chiffre</li>
                <li data-req="special">Un caractère spécial (!@#$%…)</li>
            </ul>

            <label for="password-confirm" class="sr-only">Confirmation du mot de passe</label>
            <input type="password" id="password-confirm" placeholder="Confirmer le mot de passe"
                   autocomplete="new-password">
        </div>

        <button id="btn-auth" type="button">Se connecter</button>
        <button class="switch-btn" id="btn-switch" type="button">
            Pas encore de compte ? S'inscrire
        </button>
    </div>

    <!-- Espace d'upload réservé aux membres connectés -->
    <div id="upload-section" class="hidden">
        <div class="user-info">
            <span id="user-email" title="">—</span>
            <button class="logout-btn" type="button" id="btn-logout">Déconnexion</button>
        </div>

        <h3>Uploader un fichier .lrc</h3>
        <p class="hint">
            Nommez votre fichier :<br>
            <strong>Artiste - Titre.lrc</strong><br>
            <span style="font-size:0.8em;">Max 500 Ko</span>
        </p>
        <label for="fileInput" class="sr-only">Fichier .lrc</label>
        <input type="file" id="fileInput" accept=".lrc,text/plain">
        <button type="button" id="btn-upload">Publier sur le serveur</button>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
</div>

<!-- SDK Firebase -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
        getAuth,
        signInWithEmailAndPassword,
        createUserWithEmailAndPassword,
        onAuthStateChanged,
        signOut,
        sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBRGa-C4CBQHOfoU_dVdbqf3HMGMmP7olQ",
        authDomain: "aimpe3-web.firebaseapp.com",
        projectId: "aimpe3-web",
        storageBucket: "aimpe3-web.firebasestorage.app",
        messagingSenderId: "141430245510",
        appId: "1:141430245510:web:c26a4d06a89dd4ede46907"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let isSignUp = false;

    // ========== CONSTANTES DE SÉCURITÉ ==========
    const PASSWORD_MIN_LENGTH = 12;
    const MAX_FILE_SIZE = 500 * 1024; // 500 Ko
    const MAX_LOGIN_ATTEMPTS = 5;
    const LOGIN_LOCKOUT_MS = 15 * 60 * 1000; // 15 min
    const ATTEMPTS_KEY = 'aimpe3_login_attempts';
    const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

    // ========== HELPERS ==========
    const $ = (id) => document.getElementById(id);
    const status = $('status');

    function setStatus(msg, color = '#ffffff') {
        status.innerText = msg;
        status.style.color = color;
    }

    function validateEmail(email) {
        return EMAIL_REGEX.test(email) && email.length <= 254;
    }

    function getPasswordChecks(pwd) {
        return {
            length: pwd.length >= PASSWORD_MIN_LENGTH,
            upper: /[A-Z]/.test(pwd),
            lower: /[a-z]/.test(pwd),
            digit: /\d/.test(pwd),
            special: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?~`]/.test(pwd)
        };
    }

    function isPasswordStrong(pwd) {
        return Object.values(getPasswordChecks(pwd)).every(Boolean);
    }

    // ========== ANTI-BRUTEFORCE (côté client) ==========
    function getLoginAttempts() {
        try {
            const data = JSON.parse(localStorage.getItem(ATTEMPTS_KEY) || '{}');
            if (data.lockedUntil && Date.now() > data.lockedUntil) {
                localStorage.removeItem(ATTEMPTS_KEY);
                return { count: 0 };
            }
            return data;
        } catch {
            return { count: 0 };
        }
    }

    function recordFailedAttempt() {
        const data = getLoginAttempts();
        const count = (data.count || 0) + 1;
        const newData = { count };
        if (count >= MAX_LOGIN_ATTEMPTS) {
            newData.lockedUntil = Date.now() + LOGIN_LOCKOUT_MS;
        }
        localStorage.setItem(ATTEMPTS_KEY, JSON.stringify(newData));
        return newData;
    }

    function resetLoginAttempts() {
        localStorage.removeItem(ATTEMPTS_KEY);
    }

    function isLockedOut() {
        const data = getLoginAttempts();
        return data.lockedUntil && Date.now() < data.lockedUntil;
    }

    // ========== BASCULEMENT CONNEXION / INSCRIPTION ==========
    $('btn-switch').addEventListener('click', () => {
        isSignUp = !isSignUp;
        $('form-title').innerText = isSignUp ? "Créer un compte" : "Connexion";
        $('btn-auth').innerText = isSignUp ? "S'inscrire" : "Se connecter";
        $('btn-switch').innerText = isSignUp
            ? "Déjà un compte ? Se connecter"
            : "Pas encore de compte ? S'inscrire";
        $('strength-wrapper').classList.toggle('hidden', !isSignUp);
        $('password').setAttribute('autocomplete', isSignUp ? 'new-password' : 'current-password');
        $('password-confirm').value = '';
        $('password').value = '';
        setStatus("");
        updateStrength('');
    });

    // ========== INDICATEUR DE FORCE ==========
    function updateStrength(pwd) {
        const checks = getPasswordChecks(pwd);
        const score = Object.values(checks).filter(Boolean).length;

        const bar = $('strength-bar');
        bar.classList.remove('weak', 'medium', 'strong');
        if (pwd.length === 0) {
            bar.style.width = '0';
        } else if (score <= 2) {
            bar.classList.add('weak');
        } else if (score <= 4) {
            bar.classList.add('medium');
        } else {
            bar.classList.add('strong');
        }

        document.querySelectorAll('#pwd-reqs li').forEach(li => {
            const req = li.dataset.req;
            li.classList.toggle('ok', !!checks[req]);
        });
    }

    $('password').addEventListener('input', (e) => {
        if (isSignUp) updateStrength(e.target.value);
    });

    // ========== AUTHENTIFICATION ==========
    $('btn-auth').addEventListener('click', async () => {
        const email = $('email').value.trim();
        const password = $('password').value;
        const btn = $('btn-auth');

        // Validations
        if (!validateEmail(email)) {
            setStatus("Adresse email invalide.", "#e74c3c");
            $('email').classList.add('invalid');
            return;
        }
        $('email').classList.remove('invalid');

        if (isSignUp) {
            if (!isPasswordStrong(password)) {
                setStatus(`Mot de passe trop faible (min. ${PASSWORD_MIN_LENGTH} car., maj., min., chiffre, spécial).`, "#e74c3c");
                return;
            }
            if (password !== $('password-confirm').value) {
                setStatus("Les mots de passe ne correspondent pas.", "#e74c3c");
                return;
            }
        } else {
            if (isLockedOut()) {
                const data = getLoginAttempts();
                const remaining = Math.ceil((data.lockedUntil - Date.now()) / 60000);
                setStatus(`Trop de tentatives. Réessayez dans ${remaining} min.`, "#e74c3c");
                return;
            }
            if (!password) {
                setStatus("Veuillez saisir votre mot de passe.", "#e74c3c");
                return;
            }
        }

        btn.disabled = true;
        btn.innerText = isSignUp ? "Inscription…" : "Connexion…";
        setStatus("");

        try {
            if (isSignUp) {
                await createUserWithEmailAndPassword(auth, email, password);
                setStatus("Compte créé avec succès !", "#1DB954");
            } else {
                await signInWithEmailAndPassword(auth, email, password);
                resetLoginAttempts();
                setStatus("Connexion réussie !", "#1DB954");
            }
            $('password').value = '';
            $('password-confirm').value = '';
        } catch (error) {
            // Messages génériques pour ne pas révéler si l'email existe
            let msg = "Identifiants invalides ou problème de connexion.";
            if (error.code === 'auth/email-already-in-use') {
                msg = "Un compte existe déjà avec cet email.";
            } else if (error.code === 'auth/weak-password') {
                msg = "Mot de passe trop faible.";
            } else if (error.code === 'auth/too-many-requests') {
                msg = "Trop de tentatives. Réessayez plus tard.";
            } else if (error.code === 'auth/network-request-failed') {
                msg = "Problème de connexion réseau.";
            }

            if (!isSignUp) {
                const data = recordFailedAttempt();
                if (data.lockedUntil) {
                    msg = "Trop de tentatives. Compte temporairement bloqué 15 min.";
                }
            }
            setStatus(msg, "#e74c3c");
        } finally {
            btn.disabled = false;
            btn.innerText = isSignUp ? "S'inscrire" : "Se connecter";
        }
    });

    // Soumission au clavier (Entrée)
    ['email', 'password', 'password-confirm'].forEach(id => {
        $(id).addEventListener('keydown', (e) => {
            if (e.key === 'Enter') $('btn-auth').click();
        });
    });

    // ========== DÉCONNEXION ==========
    $('btn-logout').addEventListener('click', () => signOut(auth));

    // ========== UPLOAD .LRC ==========
    $('btn-upload').addEventListener('click', async () => {
        const fileInput = $('fileInput');
        const btn = $('btn-upload');

        if (fileInput.files.length === 0) {
            setStatus("Veuillez sélectionner un fichier .lrc !", "#f39c12");
            return;
        }

        const file = fileInput.files[0];

        // Validation type & taille
        if (!/\.lrc$/i.test(file.name)) {
            setStatus("Seuls les fichiers .lrc sont acceptés.", "#e74c3c");
            return;
        }
        if (file.size > MAX_FILE_SIZE) {
            setStatus(`Fichier trop volumineux (max ${MAX_FILE_SIZE / 1024} Ko).`, "#e74c3c");
            return;
        }
        if (file.size === 0) {
            setStatus("Le fichier est vide.", "#e74c3c");
            return;
        }

        const fileName = file.name.replace(/\.[^/.]+$/, "");
        const parts = fileName.split('-');

        if (parts.length < 2) {
            setStatus("Format requis : Artiste - Titre.lrc", "#e74c3c");
            return;
        }

        const artist = parts[0].trim().slice(0, 100);
        const title = parts.slice(1).join('-').trim().slice(0, 150);

        if (!artist || !title) {
            setStatus("Artiste et titre ne peuvent pas être vides.", "#e74c3c");
            return;
        }

        btn.disabled = true;
        setStatus("Envoi vers Firestore en cours…", "#ffffff");

        const reader = new FileReader();
        reader.onerror = () => {
            setStatus("Impossible de lire le fichier.", "#e74c3c");
            btn.disabled = false;
        };
        reader.onload = async (e) => {
            const lyricsContent = e.target.result;

            if (typeof lyricsContent !== 'string' || lyricsContent.length === 0) {
                setStatus("Contenu du fichier invalide.", "#e74c3c");
                btn.disabled = false;
                return;
            }

            const queryKey = (artist + "_" + title)
                .toLowerCase()
                .replace(/[^a-z0-9]/g, "_")
                .slice(0, 200);

            try {
                await setDoc(doc(db, "lyrics", queryKey), {
                    artist: artist.toLowerCase(),
                    title: title.toLowerCase(),
                    artistOriginal: artist,
                    titleOriginal: title,
                    lyricsContent: lyricsContent,
                    size: file.size,
                    updatedAt: new Date()
                });

                setStatus("Paroles publiées avec succès !", "#1DB954");
                fileInput.value = "";
            } catch (error) {
                setStatus("Erreur lors de l'envoi : " + (error.code || 'inconnu'), "#e74c3c");
            } finally {
                btn.disabled = false;
            }
        };
        reader.readAsText(file);
    });

    // ========== ÉTAT DE CONNEXION ==========
    onAuthStateChanged(auth, (user) => {
        const authSection = $('auth-section');
        const uploadSection = $('upload-section');

        if (user) {
            authSection.classList.add('hidden');
            uploadSection.classList.remove('hidden');
            const emailEl = $('user-email');
            emailEl.innerText = user.email;
            emailEl.title = user.email;
            setStatus("");
        } else {
            authSection.classList.remove('hidden');
            uploadSection.classList.add('hidden');
            $('password').value = '';
            $('password-confirm').value = '';
        }
    });
</script>

<!--
==========================================================
⚠️ RÈGLES FIRESTORE À DÉPLOYER (recommandé)
==========================================================
rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /lyrics/{docId} {
      // Lecture publique (les clients AimpE3 téléchargent les paroles)
      allow read: if true;
      // Écriture réservée aux utilisateurs authentifiés
      allow write: if request.auth != null
                   && request.resource.data.size() < 500000
                   && request.resource.data.lyricsContent is string
                   && request.resource.data.lyricsContent.size() < 500000;
    }
  }
}

⚠️ NOTE : la clé API Firebase côté client est normale (publique par design).
   La sécurité réelle repose sur :
   - les règles Firestore ci-dessus
   - les règles d'authentification Firebase
   - l'activation de "Email enumeration protection" dans la console Firebase
   - le quota/débit Firestore
==========================================================
-->
</body>
</html>
