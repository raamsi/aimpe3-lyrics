<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AimpE3 - Gestionnaire de Paroles</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
        .container { max-width: 450px; margin: auto; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #1DB954; text-align: center; margin-bottom: 20px; }
        input[type="email"], input[type="password"], input[type="file"] { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #333; border-radius: 6px; background: #2a2a2a; color: white; box-sizing: border-box; }
        button { width: 100%; background-color: #1DB954; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #1ed760; }
        .hidden { display: none; }
        .switch-btn { background: none; color: #b3b3b3; border: none; text-decoration: underline; margin-top: 15px; font-size: 0.9em; cursor: pointer; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; }
        .user-info { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
        .logout-btn { background: #e74c3c; width: auto; padding: 6px 12px; margin: 0; }
        .hint { font-size: 0.85em; color: #a1a1aa; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎵 AimpE3 Lyrics Studio</h2>

    <!-- Formulaire d'authentification -->
    <div id="auth-section">
        <h3 id="form-title">Connexion</h3>
        <input type="email" id="email" placeholder="Adresse Email">
        <input type="password" id="password" placeholder="Mot de passe">
        
        <button id="btn-auth" onclick="handleAuth()">Se connecter</button>
        <button class="switch-btn" id="btn-switch" onclick="toggleAuthMode()">Pas encore de compte ? S'inscrire</button>
    </div>

    <!-- Espace d'upload réservé aux membres connectés -->
    <div id="upload-section" class="hidden">
        <div class="user-info">
            <span id="user-email"></span>
            <button class="logout-btn" onclick="logout()">Déconnexion</button>
        </div>

        <h3>Uploader un fichier .lrc</h3>
        <p class="hint">Nommez votre fichier : <strong>Artiste - Titre.lrc</strong></p>
        <input type="file" id="fileInput" accept=".lrc">
        <button onclick="uploadLrc()">Publier sur le serveur</button>
    </div>

    <div id="status"></div>
</div>

<!-- SDK Firebase -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBRGa-C4CBQHOfoU_dVdbqf3HMGMmP7olQ",
        authDomain: "aimpe3-web.firebaseapp.com",
        projectId: "aimpe3-web",
        storageBucket: "aimpe3-web.firebasestorage.app",
        messagingSenderId: "141430245510",
        appId: "1:141430245510:web:c26a4d06a89dd4ede46907"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let isSignUp = false;

    // Basculement Connexion / Inscription
    window.toggleAuthMode = function() {
        isSignUp = !isSignUp;
        document.getElementById('form-title').innerText = isSignUp ? "Créer un compte" : "Connexion";
        document.getElementById('btn-auth').innerText = isSignUp ? "S'inscrire" : "Se connecter";
        document.getElementById('btn-switch').innerText = isSignUp ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
    };

    // Authentification
    window.handleAuth = async function() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const status = document.getElementById('status');

        try {
            if (isSignUp) {
                await createUserWithEmailAndPassword(auth, email, password);
                status.innerText = "Compte créé avec succès !";
            } else {
                await signInWithEmailAndPassword(auth, email, password);
                status.innerText = "Connexion réussie !";
            }
            status.style.color = "#1DB954";
        } catch (error) {
            status.innerText = "Erreur : " + error.message;
            status.style.color = "red";
        }
    };

    // Déconnexion
    window.logout = function() {
        signOut(auth);
    };

    // Upload du fichier .lrc vers Firestore
    window.uploadLrc = async function() {
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');

        if (fileInput.files.length === 0) {
            status.innerText = "Veuillez sélectionner un fichier .lrc !";
            status.style.color = "orange";
            return;
        }

        const file = fileInput.files[0];
        const fileName = file.name.replace(/\.[^/.]+$/, ""); // Supprime l'extension
        const parts = fileName.split('-');

        if (parts.length < 2) {
            status.innerText = "Format requis : Artiste - Titre.lrc";
            status.style.color = "red";
            return;
        }

        const artist = parts[0].trim();
        const title = parts.slice(1).join('-').trim();

        status.innerText = "Envoi vers Firestore en cours...";
        status.style.color = "#ffffff";

        const reader = new FileReader();
        reader.onload = async function(e) {
            const lyricsContent = e.target.result;
            const queryKey = (artist + "_" + title).toLowerCase().replace(/[^a-z0-9]/g, "_");

            try {
                await setDoc(doc(db, "lyrics", queryKey), {
                    artist: artist.toLowerCase(),
                    title: title.toLowerCase(),
                    artistOriginal: artist,
                    titleOriginal: title,
                    lyricsContent: lyricsContent,
                    updatedAt: new Date()
                });

                status.innerText = "Paroles publiées avec succès sur Firestore !";
                status.style.color = "#1DB954";
                fileInput.value = "";
            } catch (error) {
                status.innerText = "Erreur Firestore : " + error.message;
                status.style.color = "red";
            }
        };
        reader.readAsText(file);
    };

    // Observer l'état de connexion
    onAuthStateChanged(auth, (user) => {
        const authSection = document.getElementById('auth-section');
        const uploadSection = document.getElementById('upload-section');
        const status = document.getElementById('status');
        status.innerText = "";

        if (user) {
            authSection.classList.add('hidden');
            uploadSection.classList.remove('hidden');
            document.getElementById('user-email').innerText = user.email;
        } else {
            authSection.classList.remove('hidden');
            uploadSection.classList.add('hidden');
        }
    });
</script>

</body>
</html>
